services:
  - type: web
    name: dae-document-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir DAE app:app --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
